[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvitts"
version = "1.0.0"
description = "Zero-shot text-to-speech for English and six Indian languages (Hindi, Marathi, Bengali, Punjabi, Gujarati, Odia)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.9",
  "torchaudio>=2.6,<2.9",
  "transformers==4.51.3",
  "safetensors",
  "tokenizers",
  "huggingface_hub>=0.30,<1.0",
  "numpy",
  "soundfile",
  "silero-vad",
  "audioseal",
  "num2words",
  "indic-numtowords==1.1.0",
  "vector-quantize-pytorch==1.17.8",
  "torchtune==0.5.0",
  "torchao==0.9.0",
  "einops",
  "scipy",
]

[project.optional-dependencies]
en-norm = ["nemo_text_processing==1.2.0", "pynini==2.1.6.post1"]

[project.scripts]
dvitts = "dvitts.cli:main"

[tool.setuptools]
packages = ["dvitts", "dvitts.codec", "dvitts.codec.neucodec", "dvitts.codec.neucodec.alias_free_torch"]

[tool.setuptools.package-data]
"dvitts.codec" = ["codec_spec.json", "w2v_bert/*"]
"dvitts.codec.neucodec" = ["LICENSE"]
